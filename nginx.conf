server {
  listen 80;
  server_name _;

  gzip on;
  gzip_types text/plain application/javascript text/css application/json image/svg+xml;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    # $uri/index.html before $uri/ so prerendered pages (dist/privacy/index.html
    # etc.) are served directly at /privacy with a 200 instead of nginx's
    # directory 301 to /privacy/ — Google OAuth verification requires the
    # privacy/terms URLs to resolve without redirects.
    try_files $uri $uri/index.html $uri/ /index.html;
  }

  location /health {
    return 200 '{"status":"ok"}';
    add_header Content-Type application/json;
  }
}
